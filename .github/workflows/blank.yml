
name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-11-arm
    timeout-minutes: 3600

    steps:
      - name: Configure Core RDP Settings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Enable Remote Desktop
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force

          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          # Remove existing firewall rule if present
          Get-NetFirewallRule -DisplayName "RDP-Tailscale" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule -ErrorAction Stop

          # Restrict RDP to Tailscale IPv4 addresses
          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale" `
            -Direction Inbound `
            -Action Allow `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress "100.64.0.0/10" `
            -ErrorAction Stop

          # Restart RDP service
          Restart-Service -Name TermService -Force

      - name: Create RDP User with Secure Password
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Add-Type -AssemblyName System.Security

          $charSet = @{
              Upper   = [char[]](65..90)
              Lower   = [char[]](97..122)
              Number  = [char[]](48..57)
              Special = ([char[]](33..47) + [char[]](58..64) +
                         [char[]](91..96) + [char[]](123..126))
          }

          # Generate password with uppercase, lowercase, numbers and symbols
          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          # Create or update RDP user
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
              Set-LocalUser -Name "RDP" -Password $securePass
          }
          else {
              New-LocalUser -Name "RDP" `
                -Password $securePass `
                -AccountNeverExpires
          }

          # Add user to required groups
          Add-LocalGroupMember -Group "Administrators" -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP" `
            -ErrorAction SilentlyContinue

          # Preserve credentials in workflow environment
          "RDP_CREDS=User: RDP | Password: $password" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if (-not (Get-LocalUser -Name "RDP")) {
              throw "User creation failed"
          }

      - name: Install Tailscale
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Detect runner architecture
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()

          if ($architecture -eq "Arm64") {
              $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-arm64.msi"
          }
          elseif ($architecture -eq "X64") {
              $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          }
          else {
              throw "Unsupported Windows architecture: $architecture"
          }

          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait -PassThru

          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

          if ($process.ExitCode -notin @(0, 3010)) {
              throw "Tailscale installation failed with exit code $($process.ExitCode)"
          }

          Write-Host "Tailscale installation completed."

      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          $ErrorActionPreference = "Stop"

          $tsExe = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tsExe)) {
              throw "Tailscale executable not found: $tsExe"
          }

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTH_KEY)) {
              throw "TAILSCALE_AUTH_KEY is missing from GitHub Secrets."
          }

          Write-Host "Checking Tailscale service..."

          $service = Get-Service -Name Tailscale -ErrorAction SilentlyContinue

          if (-not $service) {
              throw "Tailscale service was not found."
          }

          if ($service.Status -ne "Running") {
              Start-Service -Name Tailscale
          }

          $service = Get-Service -Name Tailscale
          $service.WaitForStatus(
              [System.ServiceProcess.ServiceControllerStatus]::Running,
              [TimeSpan]::FromSeconds(30)
          )

          Write-Host "Connecting to Tailscale..."

          # Limit connection time to prevent an indefinite wait
          & $tsExe up `
            "--authkey=$env:TAILSCALE_AUTH_KEY" `
            "--hostname=gh-runner-$env:GITHUB_RUN_ID" `
            --timeout=45s

          if ($LASTEXITCODE -ne 0) {
              throw "Tailscale connection failed. Check the authentication key and logs."
          }

          Write-Host "Waiting for Tailscale IPv4 address..."

          $tsIP = $null

          for ($i = 0; $i -lt 12; $i++) {
              $result = & $tsExe ip -4

              if ($LASTEXITCODE -eq 0 -and $result) {
                  $candidate = ($result | Select-Object -First 1).Trim()

                  if ($candidate -match '^100\.\d{1,3}\.\d{1,3}\.\d{1,3}$') {
                      $tsIP = $candidate
                      break
                  }
              }

              Start-Sleep -Seconds 5
          }

          if (-not $tsIP) {
              throw "Tailscale did not assign an IPv4 address."
          }

          "TAILSCALE_IP=$tsIP" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Tailscale connected successfully."
          Write-Host "Tailscale IP: $tsIP"

      - name: Verify RDP Accessibility
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          # Test TCP connectivity on RDP port
          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
              throw "TCP connection to RDP port 3389 failed."
          }

          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Credentials are stored in the workflow environment."
          Write-Host "==================`n"

          # Keep runner active until cancelled or timed out
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active"
              Start-Sleep -Seconds 300
          }
          
